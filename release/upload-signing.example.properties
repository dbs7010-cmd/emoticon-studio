# 이 파일은 예시다. 실제 값은 저장소 밖 사용자 Gradle 설정에만 둔다:
#   Windows: %USERPROFILE%\.gradle\gradle.properties  (GRADLE_USER_HOME 을 쓰면 그 폴더의 gradle.properties — 이 PC 는 C:\gradle-home)
# 또는 같은 이름의 환경변수. android/gradle.properties 에는 절대 넣지 않는다(release-check 가 FAIL).
EMOTICON_UPLOAD_STORE_FILE=<absolute-path-outside-repo>/emoticon-upload.jks
EMOTICON_UPLOAD_STORE_PASSWORD=<set-locally>
EMOTICON_UPLOAD_KEY_ALIAS=<set-locally>
EMOTICON_UPLOAD_KEY_PASSWORD=<set-locally>
# 등록한 업로드 인증서 SHA-256(공개 값) — 출시 검사에서 AAB 서명과 대조
EMOTICON_UPLOAD_CERT_SHA256=<upload-certificate-sha256>
# 내부 검수 APK(assembleRelease)만 디버그 키 허용. AAB 에는 효과 없음.
# EMOTICON_ALLOW_DEBUG_SIGNED_RELEASE=1
